<meta property="og:title" content="{{ .Title }}">
<meta property="og:site_name" content="{{ site.Title }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:description" content="{{ .Description | default site.Params.description | plainify }}">
<meta property="og:locale" content="{{ replace site.Language.Locale "-" "_" }}">
<meta property="og:type" content="{{ if and .IsPage (eq .Section "posts") }}article{{ else }}website{{ end }}">
{{ if and .IsPage (eq .Section "posts") }}
<meta property="article:published_time" content="{{ .PublishDate.Format "2006-01-02T15:04:05Z07:00" }}">
{{ range .GetTerms "tags" }}<meta property="article:tag" content="{{ .Title }}">{{ end }}
{{ end }}
{{ range first 1 (partial "templates/_funcs/get-page-images" .) }}<meta property="og:image" content="{{ .Permalink }}">{{ end }}
