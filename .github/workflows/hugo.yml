name: Build and deploy Hugo site

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install Hugo
        run: |
          version="$(tr -d '[:space:]' < .hugo-version)"
          archive="hugo_${version}_linux-amd64.tar.gz"
          release="https://github.com/gohugoio/hugo/releases/download/v${version}"

          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/${archive}" "${release}/${archive}"
          curl --fail --silent --show-error --location \
            --output "${RUNNER_TEMP}/checksums.txt" \
            "${release}/hugo_${version}_checksums.txt"
          (cd "${RUNNER_TEMP}" && grep "  ${archive}$" checksums.txt | sha256sum --check -)

          mkdir -p "${RUNNER_TEMP}/hugo"
          tar -xzf "${RUNNER_TEMP}/${archive}" -C "${RUNNER_TEMP}/hugo" hugo
          echo "${RUNNER_TEMP}/hugo" >> "${GITHUB_PATH}"

      - name: Build
        env:
          HUGO_ENVIRONMENT: production
        run: hugo --minify --gc --panicOnWarning --buildDrafts=false

      - name: Check generated site
        run: python3 scripts/check_site.py public

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: public

  deploy:
    if: github.ref == 'refs/heads/master' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
